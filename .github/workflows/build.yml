name: Build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # A merge made by Dependabot's auto-merge starts no workflow of its own;
    # this run releases what it left behind.
    - cron: '30 4 * * *'

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go version from the Dockerfile
        id: go
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "$out"; exit 1; }
      - run: go vet ./...
      - name: Test
        run: |
          mkdir -p "$PWD/cover-unit"
          go test -race -covermode=atomic -coverpkg=./... -cover ./... -args -test.gocoverdir="$PWD/cover-unit"
      - name: Cross build
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/diradvisor
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/diradvisor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-unit
          path: cover-unit

  integration:
    name: Integration (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xfsprogs zfsutils-linux e2fsprogs curl
      - name: Build test image
        run: docker build --build-arg COVER=1 -t diradvisor:test .
      - name: Integration test
        run: sudo tests/integration/run.sh diradvisor:test "$PWD/cover-integration"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cover-integration-${{ matrix.arch }}
          path: cover-integration
          if-no-files-found: ignore

  coverage:
    name: Coverage
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go version from the Dockerfile
        id: go
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          path: cover
      - name: Report
        run: |
          dirs=$(find cover -mindepth 1 -maxdepth 1 -type d | paste -sd, -)
          go tool covdata textfmt -i="$dirs" -o cover.txt
          go tool cover -html=cover.txt -o coverage.html
          {
            echo "## Coverage (unit + integration)"
            echo '```'
            go tool covdata percent -i="$dirs"
            go tool cover -func=cover.txt | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.txt | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            cover.txt
            coverage.html
      - name: Gate
        run: |
          total=$(go tool cover -func=cover.txt | awk 'END { sub("%", "", $NF); print $NF }')
          echo "coverage ${total}%, minimum 99%"
          awk -v t="$total" 'BEGIN { exit !(t >= 99) }'

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: [unit, integration, coverage]
    runs-on: ubuntu-latest
    # One release at a time: tag, image and notes must belong to one commit.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Image changed since last release?
        id: changed
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- '*.go' ':(exclude)*_test.go' go.mod go.sum Dockerfile; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant change since $last, no release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Next version
        id: drafter
        if: steps.changed.outputs.release == 'true'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build time
        id: time
        if: steps.changed.outputs.release == 'true'
        run: |
          echo "unix=$(date +%s)" >> "$GITHUB_OUTPUT"
          v="${{ steps.drafter.outputs.resolved_version }}"
          [ -n "$v" ] || { echo "no version resolved"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changed.outputs.release == 'true'
      - name: Build for the smoke test
        if: steps.changed.outputs.release == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.drafter.outputs.resolved_version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.unix }}
          tags: diradvisor:smoke
      - name: Smoke test
        if: steps.changed.outputs.release == 'true'
        run: |
          mkdir -p "$PWD/smoke"
          echo 'docker: { enabled: false }' > "$PWD/smoke/config.yml"
          docker run -d --name smoke -v "$PWD/smoke:/data" -p 18080:8080 diradvisor:smoke
          for _ in $(seq 30); do curl -sf http://127.0.0.1:18080/-/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/-/ready
          curl -sf http://127.0.0.1:18080/metrics | grep -q 'diradvisor_build_info{.*version="${{ steps.drafter.outputs.resolved_version }}"' || {
            echo "build_info missing"; docker logs smoke; exit 1; }
          docker rm -f smoke
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.changed.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.changed.outputs.release == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.drafter.outputs.resolved_version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.unix }}
          tags: |
            ghcr.io/motwok/diradvisor:${{ steps.drafter.outputs.resolved_version }}
            ghcr.io/motwok/diradvisor:latest
      - name: Publish release
        if: steps.changed.outputs.release == 'true'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml
          commitish: ${{ github.sha }}
          version: ${{ steps.drafter.outputs.resolved_version }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
