name: Build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go version from the Dockerfile
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "$out"; exit 1; }
      - run: go vet ./...
      - name: Test
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$PWD/cover-unit"
          go test -race -covermode=atomic -coverpkg=./... -cover ./... -args -test.gocoverdir="$PWD/cover-unit"
      - name: Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cover-unit | Out-Null
          go test "-covermode=atomic" "-coverpkg=./..." -cover ./... -args "-test.gocoverdir=$PWD\cover-unit"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Cross build
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/hatchlens
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/hatchlens
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/hatchlens
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cover-unit-${{ runner.os }}
          path: cover-unit

  integration:
    name: Integration (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xfsprogs zfsutils-linux e2fsprogs curl
      - name: Build test image
        run: docker build --build-arg COVER=1 -t hatchlens:test .
      - name: Integration test
        run: sudo tests/integration/run.sh hatchlens:test "$PWD/cover-integration"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cover-integration-${{ matrix.arch }}
          path: cover-integration
          if-no-files-found: ignore

  integration-images:
    name: Integration images (${{ matrix.arch }}, ${{ matrix.store }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        store: [classic, containerd]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build test image
        run: docker build --build-arg COVER=1 -t hatchlens:test .
      - name: Integration test
        run: tests/integration/run-images.sh hatchlens:test "$PWD/cover-images" ${{ matrix.store }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cover-images-${{ matrix.arch }}-${{ matrix.store }}
          path: cover-images
          if-no-files-found: ignore

  integration-windows:
    name: Integration (windows, ${{ matrix.ltsc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - ltsc: ltsc2022
            runner: windows-2022
          - ltsc: ltsc2025
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go version from the Dockerfile
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: Wait for Docker
        # The engine is sometimes not up yet when the job starts.
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 60; $i++) {
            docker version *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq 0) { Start-Service docker -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          docker version
          exit 1
      - name: Build test image
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -cover "-covermode=atomic" "-coverpkg=./..." -o dist/hatchlens.exe ./cmd/hatchlens
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker build -f Dockerfile.windows --build-arg OSVERSION=${{ matrix.ltsc }} -t hatchlens:test .
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Integration test
        shell: pwsh
        run: tests/integration/run-windows.ps1 hatchlens:test "$PWD\cover-integration" ${{ matrix.ltsc }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cover-integration-windows-${{ matrix.ltsc }}
          path: cover-integration
          if-no-files-found: ignore

  coverage:
    name: Coverage
    needs: [unit, integration, integration-images, integration-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go version from the Dockerfile
        id: go
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cover-*
          path: cover
      - name: Report
        run: |
          dirs=$(find cover -mindepth 1 -maxdepth 1 -type d | paste -sd, -)
          go tool covdata textfmt -i="$dirs" -o cover.txt
          go tool cover -html=cover.txt -o coverage.html
          {
            echo "## Coverage (unit + integration)"
            echo '```'
            go tool covdata percent -i="$dirs"
            go tool cover -func=cover.txt | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.txt | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            cover.txt
            coverage.html
      - name: Gate
        run: |
          total=$(go tool cover -func=cover.txt | awk 'END { sub("%", "", $NF); print $NF }')
          echo "coverage ${total}%, minimum 99%"
          awk -v t="$total" 'BEGIN { exit !(t >= 99) }'

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: [unit, integration, integration-images, integration-windows, coverage]
    runs-on: ubuntu-latest
    # One release at a time: tag, image and notes must belong to one commit.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: read
    env:
      IMG: ghcr.io/motwok/hatchlens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Image changed since last release?
        id: changed
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- '*.go' ':(exclude)*_test.go' go.mod go.sum Dockerfile Dockerfile.windows; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant change since $last, no release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Next version
        id: drafter
        if: steps.changed.outputs.release == 'true'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml
          commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build time
        id: time
        if: steps.changed.outputs.release == 'true'
        run: |
          echo "unix=$(date +%s)" >> "$GITHUB_OUTPUT"
          v="${{ steps.drafter.outputs.resolved_version }}"
          [ -n "$v" ] || { echo "no version resolved"; exit 1; }
      - name: Go version from the Dockerfile
        id: go
        if: steps.changed.outputs.release == 'true'
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changed.outputs.release == 'true'
        with:
          go-version: ${{ steps.go.outputs.version }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changed.outputs.release == 'true'
      - name: Build for the smoke test
        if: steps.changed.outputs.release == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            VERSION=${{ steps.drafter.outputs.resolved_version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.unix }}
          tags: hatchlens:smoke
      - name: Smoke test
        if: steps.changed.outputs.release == 'true'
        run: |
          mkdir -p "$PWD/smoke"
          printf 'disable: [ volume ]\nexclude: { containers: ["smoke"] }\n' > "$PWD/smoke/config.yml"
          docker run -d --name smoke -e HATCHLENS_CONFIG_FILE=/data/config.yml \
            -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$PWD/smoke:/data" -p 18080:8080 hatchlens:smoke
          for _ in $(seq 30); do curl -sf http://127.0.0.1:18080/-/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/-/ready
          curl -sf http://127.0.0.1:18080/metrics | grep -q 'hatchlens_build_info{.*version="${{ steps.drafter.outputs.resolved_version }}"' || {
            echo "build_info missing"; docker logs smoke; exit 1; }
          docker rm -f smoke
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.changed.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Linux
        id: linux
        if: steps.changed.outputs.release == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            VERSION=${{ steps.drafter.outputs.resolved_version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.unix }}
          outputs: type=image,name=${{ env.IMG }},push-by-digest=true,name-canonical=true,push=true
      - name: Build Windows
        if: steps.changed.outputs.release == 'true'
        env:
          VERSION: ${{ steps.drafter.outputs.resolved_version }}
          BUILD_TIME: ${{ steps.time.outputs.unix }}
        run: |
          pkg=github.com/motwok/HatchLens/internal/app
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X $pkg.Version=$VERSION -X $pkg.Revision=$GITHUB_SHA -X $pkg.BuildTime=$BUILD_TIME" \
            -o dist/hatchlens.exe ./cmd/hatchlens
          for v in ltsc2019 ltsc2022 ltsc2025; do
            docker buildx build --platform windows/amd64 -f Dockerfile.windows --build-arg OSVERSION=$v \
              --provenance=false --metadata-file "meta-$v.json" \
              --output type=image,name=$IMG,push-by-digest=true,name-canonical=true,push=true .
          done
      - name: Push manifest list
        if: steps.changed.outputs.release == 'true'
        env:
          LINUX: ${{ steps.linux.outputs.digest }}
          VERSION: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          # imagetools create drops os.version, docker manifest annotate keeps it.
          linux=$(docker buildx imagetools inspect --raw "$IMG@$LINUX" | jq -r '.manifests[].digest')
          win=$(jq -r '"\(.["containerimage.digest"]) \(.["containerimage.descriptor"].platform["os.version"])"' meta-*.json)
          docker run --rm -i -e IMG -e VERSION -e LINUX_DIGESTS="$linux" -e WIN="$win" \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" docker:29-cli sh -eu <<'EOF'
          for tag in "$VERSION" latest; do
            refs=
            for d in $LINUX_DIGESTS $(echo "$WIN" | cut -d' ' -f1); do refs="$refs $IMG@$d"; done
            docker manifest create "$IMG:$tag" $refs
            echo "$WIN" | while read -r d v; do
              docker manifest annotate --os-version "$v" "$IMG:$tag" "$IMG@$d"
            done
            docker manifest push --purge "$IMG:$tag"
          done
          EOF
      - name: Check manifest list
        env:
          VERSION: ${{ steps.drafter.outputs.resolved_version }}
        if: steps.changed.outputs.release == 'true'
        run: |
          # Without os.version Windows hosts would not get their variant.
          for tag in "$VERSION" latest; do
            docker buildx imagetools inspect --raw "$IMG:$tag" | jq -e '[.manifests[].platform] |
              ([.[] | select(.os == "linux")] | length) == 2 and
              ([.[] | select(.os == "windows" and (.["os.version"] // "") != "")] | length) == 3' >/dev/null ||
              { echo "manifest list $IMG:$tag incomplete"; exit 1; }
          done
      - name: Publish release
        if: steps.changed.outputs.release == 'true'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml
          commitish: ${{ github.sha }}
          version: ${{ steps.drafter.outputs.resolved_version }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
