name: Build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "$out"; exit 1; }
      - run: go vet ./...
      - name: Test
        run: |
          mkdir -p "$PWD/cover-unit"
          go test -race -covermode=atomic -coverpkg=./... -cover ./... -args -test.gocoverdir="$PWD/cover-unit"
      - name: Cross build
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/diradvisor
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/diradvisor
      - uses: actions/upload-artifact@v4
        with:
          name: cover-unit
          path: cover-unit

  integration:
    name: Integration (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xfsprogs zfsutils-linux e2fsprogs curl
      - name: Build test image
        run: docker build --build-arg COVER=1 -t diradvisor:test .
      - name: Integration test
        run: sudo tests/integration/run.sh diradvisor:test "$PWD/cover-integration"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cover-integration-${{ matrix.arch }}
          path: cover-integration
          if-no-files-found: ignore

  coverage:
    name: Coverage
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          pattern: cover-*
          path: cover
      - name: Report
        run: |
          dirs=$(find cover -mindepth 1 -maxdepth 1 -type d | paste -sd, -)
          go tool covdata textfmt -i="$dirs" -o cover.txt
          go tool cover -html=cover.txt -o coverage.html
          {
            echo "## Coverage (unit + integration)"
            echo '```'
            go tool covdata percent -i="$dirs"
            go tool cover -func=cover.txt | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.txt | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            cover.txt
            coverage.html

  release:
    name: Release
    if: github.event_name == 'push'
    needs: [unit, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Image changed since last release?
        id: changed
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- '*.go' go.mod go.sum Dockerfile; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant change since $last, no release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish release
        id: drafter
        if: steps.changed.outputs.release == 'true'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build time
        id: time
        run: echo "unix=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.release == 'true'
      - uses: docker/login-action@v3
        if: steps.changed.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.changed.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.drafter.outputs.resolved_version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.unix }}
          tags: |
            ghcr.io/motwok/diradvisor:${{ steps.drafter.outputs.resolved_version }}
            ghcr.io/motwok/diradvisor:latest
