name: Dependabot auto-merge

# Merges done with GITHUB_TOKEN start no workflow, so the build is started
# here right after merging.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge green Dependabot PRs, then build
        run: |
          merged=0
          for pr in $(gh pr list --repo "$REPO" --author 'app/dependabot' --state open \
              --json number,mergeStateStatus --jq '.[] | select(.mergeStateStatus == "CLEAN") | .number'); do
            gh pr merge --repo "$REPO" --squash --delete-branch "$pr" && merged=1
          done
          [ "$merged" = 0 ] || gh workflow run build.yml --repo "$REPO" --ref master
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
